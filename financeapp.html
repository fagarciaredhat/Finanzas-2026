<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2a26"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Mis Finanzas</title>
<style>
:root{--bg:#f4f6f5;--c:#fff;--t:#10201d;--m:#6d7e7a;--b:#e3e9e7;--soft:#eef2f0;--p:#0e7c66;--hero:#0e2a26;--ok:#12805c;--bad:#c4372d;--warn:#c27b0a;--sh:0 1px 2px rgba(16,32,29,.05),0 6px 20px rgba(16,32,29,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1513;--c:#14211e;--t:#e8f0ee;--m:#8aa09b;--b:#223330;--soft:#1b2c29;--p:#3fcfb0;--hero:#173d36;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:3px}
.seg button{padding:6px 14px;border-radius:99px;font-weight:600;font-size:14px;color:var(--m);transition:.25s}
.seg button.on{background:var(--c);color:var(--t);box-shadow:var(--sh)}
.per{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:600}
.per button{width:32px;height:32px;border-radius:50%;color:var(--m);font-size:18px}
.per button:active{background:var(--soft)}
#st{width:9px;height:9px;border-radius:50%;background:var(--warn);transition:.3s}#st.ok{background:var(--ok)}#st.err{background:var(--bad)}#st.sync{animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
main{max-width:960px;margin:auto;padding:4px 16px calc(130px + env(safe-area-inset-bottom));display:grid;gap:14px}
.v>*{animation:up .5s both}.v>:nth-child(2){animation-delay:.06s}.v>:nth-child(3){animation-delay:.12s}.v>:nth-child(4){animation-delay:.18s}.v>:nth-child(n+5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.v{display:grid;gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.g2{grid-template-columns:1fr}}
.cd{background:var(--c);border-radius:20px;padding:16px;box-shadow:var(--sh);border:1px solid var(--b)}
.cd h2,.sec{font-size:13px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden;border:0}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(#3fcfb033,transparent 70%)}
.hero .l{color:#ffffffb0}.big{font-size:clamp(38px,11vw,54px);font-weight:750;letter-spacing:-.02em;line-height:1.1;margin:4px 0 12px}
.l{color:var(--m);font-size:13px}.n{font-size:20px;font-weight:700}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.hero .bar{background:#ffffff26}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--ok);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.chip{display:inline-block;margin-top:12px;background:#ffffff1f;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.st3 .cd{padding:12px}.st3 .n{font-size:17px}
.in{color:var(--ok)}.out{color:var(--bad)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.tl{flex:0 0 min(250px,72%);scroll-snap-align:start;background:var(--c);border:1px solid var(--b);border-radius:20px;padding:10px;box-shadow:var(--sh);transition:transform .25s;cursor:pointer}
.tl:active{transform:scale(.97)}@media(hover:hover){.tl:hover{transform:translateY(-4px)}}
.grid .tl{flex:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.im{height:150px;border-radius:14px;background:var(--soft);display:grid;place-items:center;position:relative;overflow:hidden}
.im img{max-width:92%;max-height:92%;object-fit:contain}.im b{color:#fff;font-size:20px}
.im:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,#ffffff40 50%,transparent 58%);transform:translateX(-100%);animation:sw 6s infinite}
@keyframes sw{to{transform:translateX(100%)}}
.ti{display:grid;gap:5px;padding:10px 4px 2px}.ti b{font-size:22px}
.days{display:flex;align-items:flex-end;gap:3px;height:90px}.days i{flex:1;background:var(--p);border-radius:4px 4px 0 0;min-height:2px;height:0;opacity:.85;transition:height .8s cubic-bezier(.2,.8,.2,1)}.days i.t{opacity:1;background:var(--warn)}
.ct{display:grid;gap:10px}.ct div{display:grid;gap:4px}.ct span{display:flex;justify-content:space-between;font-size:14px}
.rw{display:flex;align-items:center;gap:12px;padding:10px 4px;border-radius:12px;cursor:pointer;transition:background .2s}.rw:active,.rw:hover{background:var(--soft)}
.rw .rm{flex:1;min-width:0}.rw small{display:block;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);font-weight:700;flex:none}
.ic.gasto{color:var(--bad)}.ic.ingreso{color:var(--ok)}.ic.ahorro{color:var(--p)}
.new{animation:nw 1.6s}@keyframes nw{from{background:color-mix(in srgb,var(--ok) 25%,transparent)}}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.chips button{padding:7px 14px;border-radius:99px;background:var(--c);border:1px solid var(--b);white-space:nowrap;font-size:14px;font-weight:600;color:var(--m)}.chips .on{background:var(--t);color:var(--bg);border-color:var(--t)}
.b1,.b2{padding:13px 18px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .15s}.b1{background:var(--p);color:#fff}.b2{background:var(--soft);color:var(--bad)}.b1:active,.b2:active{transform:scale(.97)}
.bs{padding:8px 14px;border-radius:99px;background:var(--soft);font-weight:600;font-size:13px;color:var(--t);text-transform:none;letter-spacing:0}
.inl{display:flex;gap:8px}.inl input,.inl select{flex:1}
input,select{width:100%;padding:12px 14px;border:1px solid var(--b);border-radius:12px;background:var(--bg);font-size:16px}
input:focus,select:focus{outline:2px solid var(--p);outline-offset:-1px}
nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:flex;gap:2px;background:var(--c);border:1px solid var(--b);border-radius:99px;padding:5px;box-shadow:0 8px 30px rgba(0,0,0,.14)}
nav button{display:grid;justify-items:center;padding:7px 14px;border-radius:99px;font-size:11px;font-weight:600;color:var(--m);transition:.25s;min-width:68px}nav button b{font-size:18px;line-height:1}
nav button.on{background:var(--p);color:#fff}
#fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:50%;background:var(--p);color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(14,124,102,.45);transition:transform .2s}#fab:active{transform:scale(.9) rotate(90deg)}
#ov{position:fixed;inset:0;z-index:10;background:#0008;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
#ov.on{opacity:1;pointer-events:auto}
.sh{background:var(--c);width:100%;max-width:480px;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
#ov.on .sh{transform:none}@media(min-width:600px){#ov{align-items:center}.sh{border-radius:26px}}
.gr{width:40px;height:4px;border-radius:9px;background:var(--b);margin:0 auto 12px}
.sh h3{margin:0 0 12px;font-size:20px}.sh form{display:grid;gap:12px}.sh label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--m)}
.ac{display:flex;gap:10px;margin-top:4px}.ac .b1{flex:1}
.fly{position:fixed;z-index:20;font-size:22px;font-weight:800;pointer-events:none;text-shadow:0 2px 6px #0004}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="hd"><div class="seg" id="pf"></div><div class="per"><button id="pv" aria-label="Periodo anterior">‹</button><span id="rng"></span><button id="nx" aria-label="Periodo siguiente">›</button></div><span id="st" title="Sincronización"></span></header>
<main id="v" class="v"></main>
<button id="fab" aria-label="Nuevo movimiento">+</button>
<nav id="nav"><button data-v="inicio"><b>⌂</b>Inicio</button><button data-v="mov"><b>≡</b>Movimientos</button><button data-v="plan"><b>◔</b>Presupuesto</button><button data-v="tj"><b>▭</b>Tarjetas</button></nav>
<div id="ov"></div>

const p2=n=>String(n).padStart(2,'0'),hoy=()=>new Date().toLocaleDateString('en-CA'),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),N=x=>Number(x)||0;

let P=PF.includes(localStorage.perfil)?localStorage.perfil:PF[0],D,mes,vista='inicio',filtro='todos',nuevo='',OB=JSON.parse(localStorage.ob||'[]'),LV={};

const rango=(m,d)=>{const[y,mo]=m.split('-').map(Number);return[`${m}-${p2(d)}`,`${mo==12?y+1:y}-${p2(mo==12?1:mo+1)}-${p2(d)}`]};
const periodoDe=(f,d)=>{let[y,m,dd]=f.split('-').map(Number);if(dd<d){m--;if(!m){m=12;y--}}return y+'-'+p2(m)};

/* ---- sincronización: cola de envío + lectura periódica ---- */
let fl=false,rev=0,lastW=0;
const ARR=['Movimientos','Tarjetas','Cuentas','Presupuestos','Planificados'];
async function flush(){if(fl)return;fl=true;
  try{while(OB.length){st('sync');const r=await fetch(URL_,{method:'POST',body:JSON.stringify(OB[0])});if(!r.ok)throw 0;
      let j=null;try{j=await r.json()}catch(_){}if(j&&j.error)throw 0;
      OB.shift();localStorage.ob=JSON.stringify(OB);lastW=Date.now()}st('ok')}catch(e){st('err')}fl=false}
/* rev sube con cada cambio local: sirve para detectar lecturas del Sheet que quedaron desactualizadas */
const q=op=>{rev++;OB.push({perfil:P,...op});localStorage.ob=JSON.stringify(OB);flush()};
/* respuesta válida = objeto con listas (nunca un {error:...} ni HTML); norm unifica tipos que Sheets suele alterar */
const sane=n=>n&&typeof n=='object'&&!Array.isArray(n)&&!n.error&&ARR.every(k=>n[k]===undefined||Array.isArray(n[k]));
const norm=n=>{const o={...vac(),...n};ARR.forEach(k=>o[k]=o[k].map(x=>({...x,id:String(x.id??'')})));
  o.Movimientos=o.Movimientos.map(m=>({...m,fecha:String(m.fecha||'').slice(0,10)}));return o};
const cnt=d=>ARR.reduce((s,k)=>s+(d[k]||[]).length,0);
async function cargar(){if(OB.length||fl)return flush();const p=P,r0=rev,t0=Date.now();
  try{st('sync');const r=await fetch(URL_+'?perfil='+encodeURIComponent(p));if(!r.ok)throw 0;
    const raw=await r.json();if(!sane(raw))throw 0;
    /* descartar si mientras llegaba la respuesta hubo cambios locales, o si se envió algo hace poco (el Sheet puede ir atrasado) */
    if(p!=P||rev!=r0||OB.length||fl||t0-lastW<10000){if(!OB.length&&!fl)st('ok');return}
    const n=norm(raw);
    if(!cnt(n)&&cnt(D))throw 0; /* el Sheet "vacío" frente a datos locales es sospechoso: no borrar */
    st('ok');if(JSON.stringify(n)!=JSON.stringify(D)){D=n;sv();pintar()}}catch(e){st('err')}}

/* ---- cálculos ---- */
function calc(per=mes){
  const dia=diaC(),[a,b]=rango(per,dia),A=D.Movimientos,tj=D.Tarjetas.map(t=>t.nombre);
  const mm=A.filter(m=>m.fecha>=a&&m.fecha<b).sort((x,y)=>y.fecha.localeCompare(x.fecha)||y.id.localeCompare(x.id));
  const S=(arr,f)=>arr.filter(f).reduce((s,m)=>s+N(m.monto),0),T=t=>m=>m.tipo==t;
  const ing=S(mm,T('ingreso')),gas=S(mm,T('gasto')),aho=S(mm,T('ahorro')),usado=gas+aho;
  const pr=D.Presupuestos.find(p=>p.id==per),pres=pr?N(pr.monto):0;
  const deb=S(A,m=>m.tipo=='ingreso'&&m.metodo!='Efectivo')-S(A,m=>m.tipo=='gasto'&&(m.metodo=='Débito'||m.metodo=='Transferencia'))-S(A,T('ahorro'))-S(A,T('retiro'))-S(A,T('pago'));
  const efe=S(A,m=>m.tipo=='ingreso'&&m.metodo=='Efectivo')+S(A,T('retiro'))-S(A,m=>m.tipo=='gasto'&&m.metodo=='Efectivo');
  const nd=Math.round((new Date(b)-new Date(a))/864e5),dl=Array(nd).fill(0);
  mm.filter(m=>m.tipo=='gasto'||m.tipo=='ahorro').forEach(m=>dl[Math.min(nd-1,Math.round((new Date(m.fecha)-new Date(a))/864e5))]+=N(m.monto));
  const h=hoy(),left=h<a?nd:h>=b?0:Math.round((new Date(b)-new Date(h))/864e5),ti=h>=a&&h<b?nd-left:-1;
  const cat={};mm.filter(T('gasto')).forEach(m=>cat[m.categoria||'Otros']=(cat[m.categoria||'Otros']||0)+N(m.monto));
  return{dia,a,b,mm,S,T,ing,gas,aho,usado,pres,disp:pres-usado,deb,efe,tj,dl,left,ti,cat:Object.entries(cat).sort((x,y)=>y[1]-x[1]).slice(0,5)};
}
const deuda=t=>D.Movimientos.reduce((s,m)=>m.metodo==t.nombre?s+(m.tipo=='gasto'?N(m.monto):m.tipo=='pago'?-N(m.monto):0):s,0);

const tTj=t=>{const d=deuda(t),l=N(t.limite);return tile(art(t.banco),t.banco||t.nombre,t.nombre,cu('tj'+t.id,l-d),l?Math.min(100,Math.max(0,d/l*100)):0,`Debes ${$$(d)} · Límite ${$$(l)}`,`data-et="${t.id}"`)};
const row=m=>`<div class="rw ${m.id==nuevo?'new':''}" data-e="${m.id}"><div class="ic ${m.tipo}">${IC[m.tipo]}</div><div class="rm"><b>${esc(m.categoria||NM[m.tipo])}</b><small>${fd(m.fecha)} · ${esc(m.metodo||m.cuenta||NM[m.tipo])}${m.descripcion?' · '+esc(m.descripcion):''}</small></div><b class="${m.tipo=='ingreso'?'in':m.tipo=='gasto'?'out':''}">${m.tipo=='ingreso'?'+':m.tipo=='gasto'?'−':''}${$$(N(m.monto))}</b></div>`;

  <div class="g2"><div class="cd"><h2>Ahorros</h2>${D.Cuentas.map(a=>`<div class="rw" data-v="tj"><div class="ic ahorro">◆</div><div class="rm"><b>${esc(a.nombre)}</b></div><b>${cu('c'+a.id,c.S(D.Movimientos,m=>m.tipo=='ahorro'&&m.cuenta==a.nombre))}</b></div>`).join('')||empty('Agrega cuentas de ahorro en Tarjetas')}</div>

  <div class="cd"><h2>Últimos movimientos <button class="bs" data-v="mov">Ver todos</button></h2>${c.mm.slice(0,5).map(row).join('')||empty('Aún no hay movimientos. Toca + para registrar el primero.')}</div>`},
mov(c){
  const f=c.mm.filter(m=>filtro=='todos'||m.tipo==filtro||(filtro=='otros'&&['retiro','pago'].includes(m.tipo)));
  return`<div class="chips">${[['todos','Todos'],['gasto','Gastos'],['ingreso','Ingresos'],['ahorro','Ahorros'],['otros','Retiros/Pagos']].map(([k,l])=>`<button data-f="${k}" class="${filtro==k?'on':''}">${l}</button>`).join('')}</div>
  <div class="cd">${f.map(row).join('')||empty('Sin movimientos en este filtro.')}</div>`},

  const pl=D.Planificados.filter(x=>x.mes==mes);let tp=0,tg=0;
  const rows=pl.map(x=>{const g=c.S(D.Movimientos,m=>m.tipo=='gasto'&&m.item==x.id),r=N(x.monto)-g;tp+=N(x.monto);tg+=g;
    return`<div class="rw" data-ep="${x.id}" style="display:block"><div style="display:flex;justify-content:space-between"><b>${esc(x.nombre)}</b><b class="${r<0?'out':''}">${$$(r)}</b></div><div class="bar" style="margin:6px 0"><i data-w="${N(x.monto)?Math.min(100,g/N(x.monto)*100):0}" style="${g>N(x.monto)?'background:var(--bad)':''}"></i></div><small class="l">Plan ${$$(N(x.monto))} · gastado ${$$(g)}</small></div>`}).join('');

function pintar(){
  const c=calc();$('#rng').textContent=fd(c.a)+' → '+fd(new Date(new Date(c.b+'T00:00').getTime()-864e5).toLocaleDateString('en-CA'));
  $('#v').innerHTML=V[vista](c);
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==vista));
  document.querySelectorAll('[data-cu]').forEach(e=>{const v=+e.dataset.cu,f=LV[e.dataset.k]??0;LV[e.dataset.k]=v;if(reduce||f==v)return;const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/800);e.textContent=$$(f+(v-f)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)});
  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');document.querySelectorAll('[data-h]').forEach(e=>e.style.height=e.dataset.h+'%')}));
}

/* ---- modal genérico (crear / editar) ---- */
function mod(t,F,v,ok,del){
  const o=$('#ov'),draw=()=>{
    o.innerHTML=`<div class="sh"><div class="gr"></div><h3>${t}</h3><form>${F.filter(f=>!f.if||f.if(v)).map(f=>{
      const op=typeof f.o=='function'?f.o(v):f.o;
      if(op){const x=op.map(z=>Array.isArray(z)?z:[z,z]);if(!x.some(z=>z[0]==v[f.k]))v[f.k]=x[0]?.[0]??'';return`<label>${f.l}<select name="${f.k}">${x.map(z=>`<option value="${esc(z[0])}" ${z[0]==v[f.k]?'selected':''}>${esc(z[1])}</option>`).join('')}</select></label>`}
      return`<label>${f.l}<input name="${f.k}" type="${f.t||'text'}" ${f.t=='number'?'inputmode="decimal" step="0.01" min="0"':''} ${f.list?'list="dl"':''} ${f.ro?'readonly':''} value="${esc(v[f.k])}"></label>`}).join('')}<datalist id="dl">${CATS.map(x=>`<option>${x}</option>`).join('')}</datalist>
      <div class="ac">${del?'<button type="button" class="b2" id="dx">Eliminar</button>':''}<button class="b1">Guardar</button></div></form></div>`;
    const fm=o.querySelector('form');
    fm.oninput=e=>{v[e.target.name]=e.target.value};
    fm.onchange=e=>{if(e.target.tagName=='SELECT'){v[e.target.name]=e.target.value;draw()}};
    fm.onsubmit=e=>{e.preventDefault();if(ok(v)!==false)cerrar()};
    if(del)$('#dx').onclick=()=>{if(confirm('¿Eliminar?')){del(v);cerrar()}};
  };
  draw();requestAnimationFrame(()=>o.classList.add('on'));
}
const cerrar=()=>{$('#ov').classList.remove('on');setTimeout(()=>$('#ov').innerHTML='',300)};
$('#ov').onclick=e=>{if(e.target.id=='ov')cerrar()};document.onkeydown=e=>{if(e.key=='Escape')cerrar()};

/* ---- eventos ---- */
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let b;
  if(b=g('[data-v]')){vista=b.dataset.v;pintar();scrollTo({top:0,behavior:'smooth'})}
  else if(b=g('[data-f]')){filtro=b.dataset.f;pintar()}
  else if(b=g('[data-e]'))movForm(D.Movimientos.find(x=>x.id==b.dataset.e));
  else if(b=g('[data-ep]'))simple('Planificados','gasto planificado',[{k:'nombre',l:'Nombre'},{k:'monto',l:'Monto',t:'number'}],D.Planificados.find(x=>x.id==b.dataset.ep));
  else if(b=g('[data-et]'))simple('Tarjetas','tarjeta',FT(),D.Tarjetas.find(x=>x.id==b.dataset.et));
  else if(b=g('[data-ec]'))simple('Cuentas','cuenta de ahorro',[{k:'nombre',l:'Nombre',ro:1}],D.Cuentas.find(x=>x.id==b.dataset.ec));
  else if(b=g('[data-a]')){const a=b.dataset.a;
    if(a=='ps'){const m=$('#pin').value;if(m!=='')setPres(mes,m)}
    else if(a=='np')simple('Planificados','gasto planificado',[{k:'nombre',l:'Nombre'},{k:'monto',l:'Monto',t:'number'}],null,{mes,nombre:'',monto:''});
    else if(a=='nt')simple('Tarjetas','tarjeta',FT(),null,{nombre:'',banco:'Davivienda',limite:''});
    else if(a=='nc')simple('Cuentas','cuenta de ahorro',[{k:'nombre',l:'Nombre'}],null,{nombre:''});
    else if(a=='cp'){const pv=D.Planificados.filter(x=>x.mes==mv(mes,-1));if(!pv.length)return alert('El periodo anterior no tiene lista.');pv.forEach(x=>upsert('Planificados',{id:id(),mes,nombre:x.nombre,monto:x.monto}))}}});
const FT=()=>[{k:'nombre',l:'Nombre (ej. Visa Oro)',ro:0},{k:'banco',l:'Banco',o:['Davivienda','Agrícola','Cuscatlán','Otro']},{k:'limite',l:'Límite',t:'number'}];
document.addEventListener('change',e=>{if(e.target.id=='dia')setPres('dia',e.target.value)});
$('#fab').onclick=()=>movForm();$('#pv').onclick=()=>{mes=mv(mes,-1);pintar()};$('#nx').onclick=()=>{mes=mv(mes,1);pintar()};
function perfiles(){$('#pf').innerHTML=PF.map(p=>`<button class="${p==P?'on':''}" data-p="${p}">${esc(p)}</button>`).join('')}
$('#pf').onclick=e=>{const b=e.target.closest('[data-p]');if(!b||b.dataset.p==P)return;P=b.dataset.p;localStorage.perfil=P;D=ld();LV={};mes=periodoDe(hoy(),diaC());perfiles();pintar();cargar()};

/* ---- inicio ---- */
D=ld();mes=periodoDe(hoy(),diaC());perfiles();pintar();cargar();
setInterval(()=>{if(!document.hidden)cargar()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)cargar()});addEventListener('online',cargar);
</script></body></html>
